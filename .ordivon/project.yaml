schema_version: 1
id: ordivon-world
name: Ordivon World
repository: https://github.com/zycxfyh/ordivon-world
kind: adapter
default_profiles:
  - provider
  - engineering
  - organization
documentation_roots:
  - README.md
  - AGENTS.md
  - docs
  - providers
  - modules
managed_paths:
  - README.md
  - docs/retained-boundaries.md
  - providers/cloudflare/README.md
  - providers/cloudflare/docs/operations.md
  - providers/cloudflare/docs/reliability.md
  - providers/cloudflare/docs/security.md
  - providers/cloudflare/docs/release.md
  - modules/network-observation/README.md
  - modules/network-observation/docs/vpn-namespace.md
  - docs/authority.md
enforcement: strict
maintainers:
  - zycxfyh
public_projection: ordivon-web
description: External provider adapters and private operator tools that connect Ordivon work to external systems.
