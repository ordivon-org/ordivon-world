[workspace]
members = [
  "crates/link-model",
  "crates/link-probe",
  "crates/link-wire",
  "crates/link-transport-quic",
  "crates/link-observer",
  "crates/link-console",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.95"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.98"
async-stream = "0.3.6"
axum = { version = "0.8.4", features = ["http1", "json", "tokio"] }
bytes = "1.12.1"
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5.41", features = ["derive", "env"] }
futures-core = "0.3.31"
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "bloom"] }
rcgen = { version = "0.14.8", default-features = false, features = ["crypto", "ring"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
rustls = { version = "0.23.34", default-features = false, features = ["std", "ring"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
sha2 = "0.11.0"
tempfile = "3.20.0"
thiserror = "2.0.12"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "signal", "sync", "time"] }
toml = "0.9.2"
tower = { version = "0.5.3", features = ["make", "util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
