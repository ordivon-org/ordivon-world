[workspace]
members = [
  "crates/edge-model",
  "crates/edge-probe",
  "crates/edge-wire",
  "crates/edge-transport-quic",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.95"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.98"
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5.41", features = ["derive", "env"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
tempfile = "3.20.0"
thiserror = "2.0.12"
toml = "0.9.2"
bytes = "1.12.1"
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "bloom"] }
rustls = { version = "0.23.34", default-features = false, features = ["std", "ring"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
rcgen = { version = "0.14.8", default-features = false, features = ["crypto", "ring"] }
sha2 = "0.11.0"
