name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check-repository-layout.py
      - run: python3 scripts/check-w1-evidence.py
      - run: python3 scripts/generate-capability-portfolio.py --check
      - run: python3 scripts/generate-wcp-closeout.py --check

  world-w1:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/w1-host-cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python -m unittest discover -s tests -v

  world-wxp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 experiments/wxp1-callback-continuity/experiment.py
      - run: python3 -m unittest -v experiments/wxp1-callback-continuity/test_experiment.py
      - run: python3 experiments/wxp2-remote-artifact/experiment.py
      - run: python3 -m unittest discover -s experiments/wxp2-remote-artifact -p 'test_*.py' -v
      - run: git diff --exit-code -- experiments/wxp1-callback-continuity/evidence.json experiments/wxp2-remote-artifact/evidence.json

  cloudflare-provider:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: providers/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.2'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci

  network-observation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/network-observation
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
