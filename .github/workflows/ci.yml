name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: world-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v7
        with:
          version: '0.11.7'
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run python -m compileall -q src tests scripts
      - run: uvx ruff==0.15.17 check src tests scripts
      - run: uv run python -W error::ResourceWarning -m unittest discover -s tests -v
      - run: uv run python scripts/check_dependencies.py
      - run: uv run python scripts/check_contracts.py --skip-provider-fixtures
      - run: uv run python scripts/check_docs.py
      - run: uv run ordivon-world-doctor --repo . --offline
      - run: uvx pip-audit -r requirements-audit.txt
      - run: mkdir -p target/ci-wheel && uv build --wheel --out-dir target/ci-wheel
      - run: uv run python scripts/check_wheel.py target/ci-wheel
      - run: git diff --check

  cloudflare-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: '10.33.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v7
        with:
          version: '0.11.7'
      - run: pnpm install --dir providers/cloudflare --frozen-lockfile
      - run: uv sync --locked
      - run: uv run python scripts/check_contracts.py
      - run: pnpm --dir providers/cloudflare run ci
      - run: git diff --check

  network-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y wireguard-tools
      - run: modules/network-observation/scripts/check-vpn-controller

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
