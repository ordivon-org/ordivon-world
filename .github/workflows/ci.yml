name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cloudflare-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: providers/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.2'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci

  network-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: modules/network-observation
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y wireguard-tools
      - run: scripts/check-vpn-controller
