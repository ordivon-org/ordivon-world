name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: world-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.7'
          enable-cache: false
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run python -m compileall -q src tests scripts
      - run: uvx ruff==0.15.17 check src tests scripts
      - run: uv run python -W error::ResourceWarning -m unittest discover -s tests -v
      - run: uv run python scripts/check_dependencies.py
      - run: uv run python scripts/check_contracts.py --skip-provider-fixtures
      - run: uv run python scripts/check_docs.py
      - run: uv run ordivon-world-doctor --repo . --offline
      - run: uvx pip-audit -r requirements-audit.txt
      - run: mkdir -p target/ci-wheel && uv build --wheel --out-dir target/ci-wheel
      - run: uv run python scripts/check_wheel.py target/ci-wheel
      - run: git diff --check

  cloudflare-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: '10.33.2'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.7'
          enable-cache: false
      - run: pnpm install --dir providers/cloudflare --frozen-lockfile
      - run: uv sync --locked
      - run: uv run python scripts/check_contracts.py
      - run: pnpm --dir providers/cloudflare run ci
      - run: git diff --check

  network-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y wireguard-tools

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
